<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#4f46e5">
<title>Task Tracker</title>
<style>
:root{--bg:#0b1020;--panel:#111827;--soft:#1f2937;--text:#e5e7eb;--muted:#9ca3af;--primary:#6366f1;--good:#10b981;--warn:#f59e0b;--bad:#ef4444}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1020,#172033);color:var(--text);font:15px system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:24px 16px 48px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}h1,h2{margin:0}h1{font-size:clamp(1.7rem,4vw,2.7rem)}h2{font-size:1.15rem}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#a855f7);font-weight:900}.status{color:var(--muted);font-size:.85rem;border:1px solid #334155;border-radius:999px;padding:8px 12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}.metric,.panel{background:rgba(17,24,39,.9);border:1px solid #263247;border-radius:18px;box-shadow:0 14px 35px #0003}.metric{padding:16px}.metric small,label{color:var(--muted);font-size:.78rem}.metric strong{display:block;font-size:2rem;margin:6px 0}.layout{display:grid;grid-template-columns:minmax(280px,.85fr) minmax(0,1.5fr);gap:18px}.panel{padding:20px}.panel h2{margin-bottom:16px}.field{margin-bottom:13px}.field label{display:block;margin-bottom:6px}input,select,textarea,button{width:100%;font:inherit;color:var(--text);background:#0f172a;border:1px solid #334155;border-radius:10px;padding:11px 12px}textarea{min-height:92px;resize:vertical}button{background:linear-gradient(135deg,var(--primary),#8b5cf6);border:0;font-weight:700;cursor:pointer}button.secondary{background:#1e293b;border:1px solid #334155}.actions{display:flex;gap:10px}.filters{display:flex;gap:10px;margin-bottom:14px}.filters>*{flex:1}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:620px}th,td{text-align:left;vertical-align:top;padding:11px 8px;border-bottom:1px solid #263247}th{color:var(--muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.07em}td small{color:var(--muted)}.badge{display:inline-block;border-radius:999px;padding:4px 8px;font-size:.72rem;font-weight:700}.open{background:#312e81;color:#c7d2fe}.resolved{background:#064e3b;color:#a7f3d0}.duplicate{background:#78350f;color:#fde68a}.alert{display:none;margin-top:14px;padding:10px 12px;border-radius:9px}.alert.show{display:block}.alert.ok{background:#064e3b;color:#a7f3d0}.alert.error{background:#7f1d1d;color:#fecaca}.empty{text-align:center;color:var(--muted);padding:24px}.summary{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.bar{height:12px;background:#263247;border-radius:99px;overflow:hidden;margin:8px 0}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),#a855f7);border-radius:inherit}.list{max-height:215px;overflow:auto}.issue-row{padding:9px 0;border-bottom:1px solid #263247}.issue-row:last-child{border:0}.issue-row b{display:block}.issue-row span{color:var(--muted);font-size:.8rem}@media(max-width:850px){.layout{grid-template-columns:1fr}.metrics{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){header{align-items:flex-start;flex-direction:column}.metrics{grid-template-columns:1fr 1fr}.filters,.actions{flex-direction:column}.summary{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">T</div><div><h1>Task Tracker</h1><small>Daily issues, actions, and progress</small></div></div><div class="status" id="status">Local storage ready</div></header>
<section class="metrics" id="metrics"></section>
<div class="layout">
<section class="panel"><h2>Log a task or issue</h2><form id="form">
<div class="field"><label for="date">Date</label><input id="date" type="date" required></div>
<div class="field"><label for="category">Category</label><select id="category"><option>Technical</option><option>Process</option><option>Documentation</option><option>Operational</option><option>Other</option></select></div>
<div class="field"><label for="issue">Issue / task</label><textarea id="issue" required placeholder="Describe the problem or task..."></textarea></div>
<div class="field"><label for="reason">Reason / root cause</label><textarea id="reason" required placeholder="What caused it or why does it matter?"></textarea></div>
<div class="field"><label for="resolution">Resolution / action taken</label><textarea id="resolution" required placeholder="What was done or what remains to be done?"></textarea></div>
<div class="actions"><button type="submit">Save entry</button><button class="secondary" type="reset">Clear</button></div></form><div class="alert" id="alert"></div></section>
<section class="panel"><h2>Daily log</h2><div class="filters"><input id="month" type="month" aria-label="Filter by month"><input id="search" placeholder="Search entries..." aria-label="Search entries"></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Issue and reason</th><th>Category</th><th>Status</th></tr></thead><tbody id="rows"></tbody></table></div><div class="summary"><div><small>Entries by month</small><div id="months"></div></div><div><small>Most repeated issues</small><div class="list" id="repeats"></div></div></div></section>
</div></div>
<script>
/* Replace this URL with your deployed Google Apps Script /exec URL. */
const SHEET_ENDPOINT='https://script.google.com/macros/s/REPLACE_WITH_SCRIPT_ID/exec';
const KEY='task-tracker-entries-v1';let entries=[];
const $=id=>document.getElementById(id), today=()=>new Date().toISOString().slice(0,10);
function clean(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim()}
function words(s){return new Set(clean(s).split(' ').filter(Boolean))}
function similarity(a,b){let x=words(a),y=words(b),common=[...x].filter(w=>y.has(w)).length,union=new Set([...x,...y]).size;return union?common/union:0}
function duplicate(item){return entries.find(e=>similarity(item.issue+' '+item.reason,e.issue+' '+e.reason)>=.65)}
function save(){localStorage.setItem(KEY,JSON.stringify(entries))}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function filtered(){let m=$('month').value,q=clean($('search').value);return entries.filter(e=>(!m||e.date.startsWith(m))&&(!q||clean(JSON.stringify(e)).includes(q)).sort((a,b)=>b.date.localeCompare(a.date)))}
function render(){let total=entries.length,month=today().slice(0,7),current=entries.filter(e=>e.date.startsWith(month)).length,resolved=entries.filter(e=>e.status==='Resolved').length,dupes=entries.filter(e=>e.duplicate).length;$('metrics').innerHTML=[['Total',total,'all entries'],['This month',current,month],['Resolved',resolved,'completed'],['Duplicates',dupes,'similar issues']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><small>${x[2]}</small></div>`).join('');let list=filtered();$('rows').innerHTML=list.length?list.map(e=>`<tr><td>${esc(e.date)}</td><td><b>${esc(e.issue)}</b><br><small>${esc(e.reason)}<br>${esc(e.resolution)}</small></td><td>${esc(e.category)}</td><td><span class="badge ${e.duplicate?'duplicate':e.status==='Resolved'?'resolved':'open'}">${e.duplicate?'Duplicate':e.status}</span></td></tr>`).join(''):'<tr><td class="empty" colspan="4">No entries found.</td></tr>';let by={};entries.forEach(e=>by[e.date.slice(0,7)]=(by[e.date.slice(0,7)]||0)+1);let max=Math.max(1,...Object.values(by));$('months').innerHTML=Object.keys(by).sort().reverse().slice(0,6).map(k=>`<div><small>${k} · ${by[k]}</small><div class="bar"><i style="width:${by[k]/max*100}%"></i></div></div>`).join('')||'<small>No data yet.</small>';let repeats=entries.filter(e=>e.duplicate).slice(-5).reverse();$('repeats').innerHTML=repeats.length?repeats.map(e=>`<div class="issue-row"><b>${esc(e.issue)}</b><span>${esc(e.date)}</span></div>`).join(''):'<small>No repeated issues yet.</small>'}
function alertMsg(text,error=false){$('alert').textContent=text;$('alert').className='alert show '+(error?'error':'ok')}
async function sync(item){if(SHEET_ENDPOINT.includes('REPLACE_WITH'))return; $('status').textContent='Syncing…';try{let r=await fetch(SHEET_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(item)});$('status').textContent=r.ok?'Synced to Google Sheets':'Saved locally';}catch(e){$('status').textContent='Saved locally; sync unavailable'}}
$('form').addEventListener('submit',async e=>{e.preventDefault();let item={id:Date.now().toString(),date:$('date').value,category:$('category').value,issue:$('issue').value.trim(),reason:$('reason').value.trim(),resolution:$('resolution').value.trim(),status:/fixed|resolved|completed/i.test($('issue').value)?'Resolved':'Open',createdAt:new Date().toISOString(),duplicate:false};let match=duplicate(item);if(match){item.duplicate=true;alertMsg('Similar issue detected and saved as a duplicate.')}else alertMsg('Entry saved successfully.');entries.push(item);save();render();sync(item);$('form').reset();$('date').value=today()});$('form').addEventListener('reset',()=>setTimeout(()=>{$('date').value=today()},0));$('month').addEventListener('input',render);$('search').addEventListener('input',render);try{entries=JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){entries=[]}$('date').value=today();render();
</script>
</body>
</html>
